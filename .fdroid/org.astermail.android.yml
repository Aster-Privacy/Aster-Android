    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev rustup
    gradle:
      - fdroid
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup default 1.92.0
