appId: ${APP_ID}
tags:
  - contacts
name: contact_groups_create_filter_assign_delete
---
- runFlow: ../../setup/sign_in.yaml
- tapOn: "open drawer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "^Contacts$"
    timeout: 5000
- tapOn: "^Contacts$"
- extendedWaitUntil:
    visible: "Contacts"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Groups Bot"
    commands:
      - tapOn: "Groups Bot"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Delete contact"
          direction: DOWN
      - tapOn: "Delete contact"
      - extendedWaitUntil:
          visible: "^Delete$"
          timeout: 5000
      - tapOn: "^Delete$"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Maestro Crew"
    commands:
      - longPressOn: "Maestro Crew"
      - extendedWaitUntil:
          visible: "Rename group"
          timeout: 5000
      - tapOn:
          id: "contact_group_delete"
      - extendedWaitUntil:
          visible: "^Delete$"
          timeout: 5000
      - tapOn: "^Delete$"
      - waitForAnimationToEnd

- takeScreenshot: groups_chip_row

- assertVisible: "^All$"
- assertVisible: "^Favorites$"
- assertVisible: "^New group$"

- tapOn: "^New group$"
- extendedWaitUntil:
    visible: "Create group"
    timeout: 5000
- tapOn:
    id: "contact_group_name_field"
- inputText: "Maestro Crew"
- takeScreenshot: groups_editor
- tapOn: "^Create$"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Maestro Crew"
    timeout: 10000
- takeScreenshot: groups_created

- tapOn: "Maestro Crew"
- waitForAnimationToEnd
- takeScreenshot: groups_filter_empty
- tapOn: "^All$"
- waitForAnimationToEnd

- tapOn:
    id: "fab_add_contact"
- waitForAnimationToEnd
- tapOn:
    id: "contact_field_name"
- inputText: "Groups Bot"
- tapOn:
    id: "contact_field_email"
- inputText: "groups_bot_contact@example.org"
- tapOn:
    id: "contact_save"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Groups Bot"
    timeout: 10000

- tapOn: "Groups Bot"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Groups"
    timeout: 5000
- takeScreenshot: groups_detail_card
- tapOn:
    id: "manage_contact_groups"
- extendedWaitUntil:
    visible: "Maestro Crew"
    timeout: 5000
- takeScreenshot: groups_manage_dialog
- tapOn: "Maestro Crew"
- waitForAnimationToEnd
- tapOn: "^Close$"
- back
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Maestro Crew"
    timeout: 10000
- tapOn: "Maestro Crew"
- waitForAnimationToEnd
- assertVisible: "Groups Bot"
- takeScreenshot: groups_filter_member

- tapOn: "^All$"
- waitForAnimationToEnd
- tapOn: "Groups Bot"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Delete contact"
    direction: DOWN
- tapOn: "Delete contact"
- extendedWaitUntil:
    visible: "^Delete$"
    timeout: 5000
- tapOn: "^Delete$"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "Groups Bot"
    timeout: 10000

- longPressOn: "Maestro Crew"
- extendedWaitUntil:
    visible: "Rename group"
    timeout: 5000
- takeScreenshot: groups_rename_dialog
- tapOn:
    id: "contact_group_delete"
- extendedWaitUntil:
    visible: "^Delete$"
    timeout: 5000
- tapOn: "^Delete$"
- waitForAnimationToEnd
- assertNotVisible: "Maestro Crew"
- takeScreenshot: groups_deleted
