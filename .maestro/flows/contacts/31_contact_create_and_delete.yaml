appId: ${APP_ID}
tags:
  - contacts
name: contact_create_and_delete_roundtrip
---
- runFlow: ../../setup/sign_in.yaml
- tapOn: "open drawer"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "^Contacts$"
    timeout: 5000
- tapOn: "^Contacts$"
- extendedWaitUntil:
    visible: "Contacts"
    timeout: 10000
- runFlow:
    when:
      visible: "Maestro Bot"
    commands:
      - tapOn: "Maestro Bot"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Delete contact"
          direction: DOWN
      - tapOn: "Delete contact"
      - extendedWaitUntil:
          visible: "^Delete$"
          timeout: 5000
      - tapOn: "^Delete$"
      - waitForAnimationToEnd
- tapOn:
    id: "fab_add_contact"
- waitForAnimationToEnd
- takeScreenshot: contact_edit
- tapOn:
    id: "contact_field_name"
- inputText: "Maestro Bot"
- tapOn:
    id: "contact_field_email"
- inputText: "maestro_bot_contact@example.org"
- tapOn:
    id: "contact_save"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Maestro Bot"
    timeout: 10000
- takeScreenshot: contact_after_save
- tapOn: "Maestro Bot"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Delete contact"
    direction: DOWN
- tapOn: "Delete contact"
- extendedWaitUntil:
    visible: "^Delete$"
    timeout: 5000
- tapOn: "^Delete$"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "Maestro Bot"
    timeout: 10000
- takeScreenshot: contact_deleted
