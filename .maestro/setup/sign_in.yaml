appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible: "^(Inbox|Primary)$"
    commands:
      - launchApp:
          clearState: false
      - waitForAnimationToEnd
      - repeat:
          times: 6
          while:
            notVisible: "^(Inbox|Primary)$"
          commands:
            - back
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "^(Inbox|Primary)$"
          timeout: 40000
- assertVisible:
    text: "^(Inbox|Primary)$"
