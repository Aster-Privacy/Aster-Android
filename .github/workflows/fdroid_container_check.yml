name: fdroid_container_check

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build_fdroid_in_container.sh'
      - 'scripts/release.sh'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/fdroid_container_check.yml'
  pull_request:
    paths:
      - 'scripts/build_fdroid_in_container.sh'
      - 'scripts/release.sh'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/fdroid_container_check.yml'
  workflow_dispatch:

jobs:
  fdroid_container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: build fdroid flavor in the buildserver image
        run: bash scripts/build_fdroid_in_container.sh "$(git rev-parse HEAD)" "$RUNNER_TEMP/fdroid_out"
