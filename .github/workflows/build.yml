name: build

on:
  push:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTER_UNSIGNED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: cp app/google-services.json.example app/google-services.json
      - run: ./gradlew assembleFullRelease
      - run: ./gradlew assembleFdroidRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-release
          path: app/build/outputs/apk/full/release/*.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S error scripts/*.sh

  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASTER_UNSIGNED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - run: cp app/google-services.json.example app/google-services.json
      - run: ./gradlew testFullDebugUnitTest
