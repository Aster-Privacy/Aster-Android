name: build

on:
  push:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.toml'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTER_UNSIGNED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: |
          cp app/google-services.json.example app/google-services.json
          ./gradlew assembleFullRelease
          ./gradlew assembleFdroidRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-release
          path: app/build/outputs/apk/full/release/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk

  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check shell syntax
        run: for f in scripts/*.sh; do bash -n "${f}"; done

      - name: shellcheck
        run: shellcheck -S error scripts/*.sh

  unit_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      ASTER_UNSIGNED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: cp app/google-services.json.example app/google-services.json

      - name: translation script tests
        run: |
          node --test app/src/test/js/*.test.mjs
          ./gradlew testFullDebugUnitTest
