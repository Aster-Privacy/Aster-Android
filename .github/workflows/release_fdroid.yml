name: release_fdroid

# Preflight only. F-Droid compiles the fdroid flavor on their own buildserver and signs
# it with their key, so this artifact is never published to a release. It exists to catch
# a flavor that would fail to compile there. Never attach it to a GitHub release: an
# unsigned or differently signed APK next to the full build is exactly the confusion the
# -full asset naming exists to prevent.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release_fdroid:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: build fdroid flavor
        run: ./gradlew assembleFdroidRelease

      - name: upload unsigned fdroid apk
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-flavor-unsigned-preflight-do-not-publish
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
