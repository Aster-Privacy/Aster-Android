name: release_artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_artifacts:
    runs-on: ubuntu-latest
    env:
      ASTER_UNSIGNED: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: build both flavors
        run: ./gradlew assembleFullRelease assembleFdroidRelease

      - name: upload unsigned fdroid apk
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-unsigned
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

      - name: upload unsigned full apk
        uses: actions/upload-artifact@v4
        with:
          name: full-unsigned
          path: app/build/outputs/apk/full/release/app-full-release-unsigned.apk
