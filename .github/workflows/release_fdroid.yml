name: release_fdroid

# Preflight only. The F-Droid recipe pins AllowedAPKSigningKeys to our certificate and
# fetches Aster-Mail-fdroid-<version>.apk from the tag through Binaries:, then rebuilds
# the fdroid flavor from the tagged source and publishes our APK only if the two match.
# The published fdroid APK is built and signed on the release machine by
# scripts/release.sh, never here: the signing key stays out of CI. This unsigned Linux
# build exists to catch a flavor that would fail to compile on F-Droid's buildserver.
# Never attach this artifact to a GitHub release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release_fdroid:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: build fdroid flavor
        run: ./gradlew assembleFdroidRelease

      - name: upload unsigned fdroid apk
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-flavor-unsigned-preflight-do-not-publish
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
