name: validate-fastlane-metadata

on:
  pull_request:
    paths:
      - 'fastlane/metadata/**'
  push:
    paths:
      - 'fastlane/metadata/**'

permissions:
  contents: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@c8857fdbbd3e00f9a5cbe8604bcecfa95ce8fef8 # v2
        with:
          fastlaneDir: ./fastlane/metadata/android
