name: verify_release_assets

# Fails loudly when a published release is missing an APK that a channel depends on.
# Fixed-name Aster-Mail.apk feeds astermail.org and Aster-Mail-<ver>-full.apk pins the
# same signed full-flavor build to this version. Aster-Mail-fdroid-<ver>.apk is the
# asset the F-Droid recipe fetches through Binaries:. The recipe pins
# AllowedAPKSigningKeys to our certificate, so every tag must carry that APK, signed
# with the release key and reproducible from the tagged source. Asset names must state
# the flavor, so a bare Aster-Mail-<ver>.apk is rejected.

on:
  release:
    types: [released, published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to check, for example v0.6.156
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check required assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -u
          ver="${TAG#v}"
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '[.assets[].name] | join(" ")')
          echo "tag ${TAG} carries: ${assets}"
          fail=0
          for want in "Aster-Mail.apk" "Aster-Mail-${ver}-full.apk" "Aster-Mail-fdroid-${ver}.apk"; do
            case " ${assets} " in
              *" ${want} "*) echo "  OK   ${want}" ;;
              *) echo "  MISS ${want}"; fail=1 ;;
            esac
          done
          for banned in "Aster-Mail-${ver}.apk" "Aster-Mail-fdroid.apk"; do
            case " ${assets} " in
              *" ${banned} "*) echo "  BAD  ${banned} must not ship, rename it or delete it"; fail=1 ;;
            esac
          done
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body')
          if [ -z "${body}" ]; then
            echo "  MISS release notes are empty"
            fail=1
          else
            echo "  OK   release notes present"
          fi
          if [ "${fail}" != "0" ]; then
            echo
            echo "A missing Aster-Mail.apk breaks the download link on astermail.org."
            echo "A missing Aster-Mail-fdroid-<version>.apk fails F-Droid's build for this"
            echo "tag: their recipe fetches it through Binaries: and verifies it against"
            echo "their own rebuild under our AllowedAPKSigningKeys certificate."
            echo "The versioned full copy must be named Aster-Mail-<version>-full.apk."
            echo "Fix the assets on ${TAG}."
            exit 1
          fi
