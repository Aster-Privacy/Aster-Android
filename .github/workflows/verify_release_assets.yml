name: verify_release_assets

# Fails loudly when a published release is missing an APK that a channel depends on.
# Fixed-name Aster-Mail.apk feeds astermail.org and Aster-Mail-<ver>-full.apk pins the
# same signed full-flavor build to this version. Aster-Mail-fdroid-<ver>.apk is the
# asset the F-Droid recipe fetches through Binaries:. The recipe pins
# AllowedAPKSigningKeys to our certificate, so every tag must carry that APK, signed
# with the release key and reproducible from the tagged source. Asset names must state
# the flavor, so a bare Aster-Mail-<ver>.apk is rejected.

on:
  release:
    types: [released, published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to check, for example v0.6.156
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check required assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -u
          ver="${TAG#v}"
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '[.assets[].name] | join(" ")')
          echo "tag ${TAG} carries: ${assets}"
          fail=0
          for want in "Aster-Mail.apk" "Aster-Mail-${ver}-full.apk" "Aster-Mail-fdroid-${ver}.apk"; do
            case " ${assets} " in
              *" ${want} "*) echo "  OK   ${want}" ;;
              *) echo "  MISS ${want}"; fail=1 ;;
            esac
          done
          for banned in "Aster-Mail-${ver}.apk" "Aster-Mail-fdroid.apk"; do
            case " ${assets} " in
              *" ${banned} "*) echo "  BAD  ${banned} must not ship, rename it or delete it"; fail=1 ;;
            esac
          done
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body')
          if [ -z "${body}" ]; then
            echo "  MISS release notes are empty"
            fail=1
          else
            echo "  OK   release notes present"
          fi
          if [ "${fail}" != "0" ]; then
            echo
            echo "A missing Aster-Mail.apk breaks the download link on astermail.org."
            echo "A missing Aster-Mail-fdroid-<version>.apk fails F-Droid's build for this"
            echo "tag: their recipe fetches it through Binaries: and verifies it against"
            echo "their own rebuild under our AllowedAPKSigningKeys certificate."
            echo "The versioned full copy must be named Aster-Mail-<version>-full.apk."
            echo "Fix the assets on ${TAG}."
            exit 1
          fi

      - name: check signing certificate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CERT_SHA: 88b0a8a6fb94ee73a454a0f92732bd408e92e51ec1e9556744e5f00556100977
          PLAY_CERT_SHA: c20da21dda9d35452675341911b001e53280b5c891ab909b13bf27637740a6af
        run: |
          set -u
          ver="${TAG#v}"
          colon_fp() { echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }
          cert_colon=$(colon_fp "${CERT_SHA}")
          play_colon=$(colon_fp "${PLAY_CERT_SHA}")
          fail=0
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body' > body.md
          if grep -qF "${cert_colon}" < <(tr 'a-f' 'A-F' < body.md); then
            echo "  OK   release notes carry the signing fingerprint"
          else
            echo "  MISS release notes do not carry ${cert_colon}, append scripts/apk_verification.md"
            fail=1
          fi
          for fp in $(grep -oiE '([0-9a-f]{2}:){31}[0-9a-f]{2}' body.md | tr 'a-f' 'A-F' | sort -u || true); do
            if [ "${fp}" != "${cert_colon}" ] && [ "${fp}" != "${play_colon}" ]; then
              echo "  BAD  release notes carry an unknown fingerprint ${fp}"
              fail=1
            fi
          done
          bt=$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)
          apksigner="${ANDROID_HOME}/build-tools/${bt}/apksigner"
          mkdir -p apks
          for apk in "Aster-Mail.apk" "Aster-Mail-${ver}-full.apk" "Aster-Mail-fdroid-${ver}.apk"; do
            if ! gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${apk}" --dir apks --clobber; then
              echo "  MISS ${apk} could not be downloaded"
              fail=1
              continue
            fi
            digests=$("${apksigner}" verify --print-certs "apks/${apk}" | tr -d '\r' | grep -E '^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest:' | awk '{print $NF}' | sort -u || true)
            if [ "${digests}" = "${CERT_SHA}" ]; then
              echo "  OK   ${apk} is signed with the release certificate"
            else
              echo "  BAD  ${apk} signers: ${digests:-none}, expected ${CERT_SHA}"
              fail=1
            fi
          done
          if [ "${fail}" != "0" ]; then
            echo
            echo "Every APK on a release must be signed with the release certificate, and the"
            echo "release notes must publish its fingerprint so people can check their download."
            echo "Fix ${TAG}."
            exit 1
          fi
